# Render deployment — one web service serves the API + built React app.
# In the Render dashboard, set the environment variables listed below.

services:
  - type: web
    name: social-engagement-agent
    runtime: node
    plan: free
    # --include=dev matters: NODE_ENV=production makes npm skip devDependencies,
    # and vite lives in frontend devDependencies (needed to build the UI).
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HINDSIGHT_BASE_URL
        sync: false
      - key: HINDSIGHT_API_KEY
        sync: false
      - key: HINDSIGHT_BANK_ID
        value: social-engagement-agent
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
