# Render deployment — one web service serves the API + built React app,
# backed by a managed Postgres instance so accounts and connections survive
# redeploys (Render's free web tier has an ephemeral disk).
#
# After the first sync, enter the secret values in the dashboard when prompted.

databases:
  - name: social-engagement-agent-db
    plan: free
    databaseName: engagement_agent
    user: agent

services:
  - type: web
    name: social-engagement-agent
    runtime: node
    plan: free
    # --include=dev matters: NODE_ENV=production makes npm skip devDependencies,
    # and vite lives in frontend devDependencies (needed to build the UI).
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Persistent store for users + connected accounts (falls back to SQLite
      # if this is ever unreachable, so the demo never breaks).
      - key: DATABASE_URL
        fromDatabase:
          name: social-engagement-agent-db
          property: connectionString
      # Signs session JWTs and encrypts stored platform tokens.
      - key: AUTH_SECRET
        sync: false
      - key: HINDSIGHT_BASE_URL
        sync: false
      - key: HINDSIGHT_API_KEY
        sync: false
      # Google sign-in. Optional: without these the app still works and offers a
      # labelled demo sign-in instead of the real consent screen.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: HINDSIGHT_BANK_ID
        value: social-engagement-agent
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
